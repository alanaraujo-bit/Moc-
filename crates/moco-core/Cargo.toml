[package]
name = "moco-core"
description = "Mocó core: cryptography, vault model and storage shared by every Mocó client."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

# Cryptography — stable, widely reviewed RustCrypto generation (see DECISIONS.md D-004).
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10.1", features = ["stream"] }
hkdf = "0.12.4"
sha2 = "0.10.9"
sha1 = "0.10.6"
hmac = "0.12.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2.1", features = ["zeroize", "rand_core"] }
rand = "0.8.5"
subtle = "2.6"

unicode-normalization = "=0.1.25"
data-encoding = "2.9"
rusqlite = { version = "0.40", features = ["bundled"] }
zxcvbn = "3.1"
csv = "1.3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[dev-dependencies]
hex = "0.4"

[features]
# Exposes the in-memory reference server (used by tests and client integration tests).
fake-server = []
