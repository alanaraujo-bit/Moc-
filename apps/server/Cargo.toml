[package]
name = "moco-server"
description = "Mocó sync server: stores ciphertext, verifies signatures, never decrypts."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
moco-core = { path = "../../crates/moco-core" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "macros", "migrate", "chrono"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
zeroize.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8.5"
sha2 = "0.10.9"
hmac = "0.12.1"
hkdf = "0.12.4"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.1"
data-encoding = "2.9"
thiserror.workspace = true

[dev-dependencies]
moco-core = { path = "../../crates/moco-core", features = ["fake-server"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
