[workspace]
resolver = "2"
members = ["crates/moco-core", "apps/desktop/src-tauri", "apps/server"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"
authors = ["Mocó"]
repository = "https://github.com/alanaraujo-bit/Moc-"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Argon2 is painfully slow unoptimized; keep dev unlocks realistic.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20poly1305]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
